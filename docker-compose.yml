version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: glyphhash-postgres
    environment:
      POSTGRES_USER: glyphhash
      POSTGRES_PASSWORD: glyphhash
      POSTGRES_DB: glyphhash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glyphhash"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (for caching and pub/sub - future use)
  redis:
    image: redis:7-alpine
    container_name: glyphhash-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack for S3 simulation (development only)
  localstack:
    image: localstack/localstack:latest
    container_name: glyphhash-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  redis_data:
  localstack_data:
